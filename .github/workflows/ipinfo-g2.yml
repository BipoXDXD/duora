# Dedicated G2 preparation. Existing CI/release workflows and application hosts remain unchanged.
name: IPinfo Lite G2

on:
  pull_request:
    paths:
      - .github/workflows/ipinfo-g2.yml
      - tools/IpinfoG2/**
      - scripts/geolocation/**
      - backend/src/Duora.Infrastructure/Geolocation/**
      - backend/src/Duora.Core/Geolocation/**
      - backend/tests/Duora.IntegrationTests/Geolocation/SyntheticMmdb.cs
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
  workflow_dispatch:
    inputs:
      mode:
        description: Preflight without provider access, or an independently authorized real rehearsal
        required: true
        default: preflight
        type: choice
        options: [preflight, inventory, validate]

permissions:
  contents: read

concurrency:
  group: ipinfo-g2-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  synthetic:
    name: g2-synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: python3 -m unittest discover -s scripts/geolocation -v
      - run: dotnet restore tools/IpinfoG2/IpinfoG2.csproj --locked-mode
      - run: dotnet build tools/IpinfoG2/IpinfoG2.csproj --no-restore
      - run: dotnet run --project tools/IpinfoG2/IpinfoG2.csproj --no-build -- --self-test
      - run: dotnet format tools/IpinfoG2/IpinfoG2.csproj --verify-no-changes --no-restore

  eligibility:
    needs: synthetic
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'BipoXDXD/duora' && (inputs.mode == 'inventory' || inputs.mode == 'validate')
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require protected G2 environment and exact main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/geolocation/g2_environment.py

  rehearsal:
    needs: eligibility
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'BipoXDXD/duora' && (inputs.mode == 'inventory' || inputs.mode == 'validate')
    environment: g2-ipinfo-lite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore tools/IpinfoG2/IpinfoG2.csproj --locked-mode
      - run: dotnet build tools/IpinfoG2/IpinfoG2.csproj --no-restore
      - name: One authorized download and sanitized measurement
        id: rehearsal
        env:
          G2_MODE: ${{ inputs.mode }}
          G2_PROFILE_JSON: ${{ vars.G2_PROFILE_JSON }}
          G2_IPINFO_LITE_DOWNLOAD_TOKEN: ${{ secrets.G2_IPINFO_LITE_DOWNLOAD_TOKEN }}
        run: dotnet run --project tools/IpinfoG2/IpinfoG2.csproj --no-build -- --rehearse
      - name: Delete raw temporary database
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/ipinfo-g2"
      - name: Sanitized evidence only
        if: ${{ always() && steps.rehearsal.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: g2-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ipinfo-g2-report.json
          if-no-files-found: error
          retention-days: 1
