# Publicação explícita; não implanta nem acessa o ambiente de produção.
name: Publish release images

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of a main commit with all nine CI gates successful
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/publish-images.yml
      - scripts/release/**

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.event.inputs.commit || github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      commit: ${{ steps.gates.outputs.commit }}
      ci_run: ${{ steps.gates.outputs.ci_run }}
      ci_attempt: ${{ steps.gates.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test release gate
        run: python3 -m unittest discover -s scripts/release -v
      - name: Verify exact commit and CI gates
        id: gates
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ inputs.commit }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          python3 scripts/release/check_ci.py

  images:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: verify
    permissions:
      contents: read
      packages: write
    name: images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
      CI_RUN: ${{ needs.verify.outputs.ci_run }}
      CI_ATTEMPT: ${{ needs.verify.outputs.ci_attempt }}
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.verify.outputs.commit }}

      - name: Registrar arquitetura do runner (spec 2.4)
        run: |
          echo "uname -m: $(uname -m)"
          echo "Runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      # BuildKit recebe a licença somente durante o build do worker (ADR-0025).
      - name: Build web, worker e migrator
        id: build-dotnet
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          test -n "$SIXLABORS_LICENSE_KEY" || { echo "::error::Secret SIXLABORS_LICENSE_KEY ausente"; exit 1; }
          grep -q 'id=sixlabors_license' infra/images/dotnet/Dockerfile
          license=(--secret "id=sixlabors_license,env=SIXLABORS_LICENSE_KEY")
          for target in web worker migrator; do
            docker buildx build --file infra/images/dotnet/Dockerfile --target "$target" --platform "$PLATFORM" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
              --build-arg GIT_COMMIT="$RELEASE_COMMIT" --tag "duora-$target:ci" "${license[@]}" --load .
          done

      # O verificador é obrigatório e nunca imprime a chave.
      - name: Conferir que a licença não ficou na imagem do worker
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: python3 scripts/supply-chain/check_image_secret.py duora-worker:ci SIXLABORS_LICENSE_KEY

      - name: Build edge e postgres
        id: build-edge-postgres
        run: |
          docker buildx build --file infra/images/edge/Dockerfile --platform "$PLATFORM" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --build-arg GIT_COMMIT="$RELEASE_COMMIT" --tag duora-edge:ci --load .
          docker buildx build --file infra/images/postgres/Dockerfile --platform "$PLATFORM" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag duora-postgres:ci --load .

      # Executa cada binário nativo na arquitetura do runner, sem subir o ambiente.
      - name: Verificar as imagens
        run: |
          docker run --rm --entrypoint /app/efbundle duora-migrator:ci --help > /dev/null
          docker run --rm duora-postgres:ci pgbackrest version
          DUORA_POSTGRES_IMAGE=duora-postgres:ci python3 -m unittest discover -s scripts/deploy \
            -p 'test_db_privileges.py' -v
          docker run --rm -e DUORA_DOMAIN=app.example.com -e DUORA_TLS=ops@example.com \
            --entrypoint caddy duora-edge:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
          for image in web worker migrator edge; do
            echo "duora-$image: $(docker image inspect --format '{{.Architecture}} user={{.Config.User}}' "duora-$image:ci")"
          done

      # Spec 18.5: backup físico, WAL e restore PITR de ponta a ponta com o compose.prod.yml real e um MinIO só como
      # dublê S3 (docs/operations/backup-restore.md). Prova também que o postgres não alcança a internet.
      - name: Drill de restore (pgBackRest + MinIO de teste)
        # bash do Actions roda com -o pipefail: uma falha do drill não some atrás do tee.
        shell: bash
        run: |
          python3 scripts/backup/restore_drill.py --image duora-postgres:ci | tee "$RUNNER_TEMP/drill.log"
          { echo "### Drill de restore (${{ matrix.arch }})"; grep '^\[drill\] OK' "$RUNNER_TEMP/drill.log"; } \
            >> "$GITHUB_STEP_SUMMARY"

      # Spec 17.1: vulnerabilidades das imagens (SO e binários), HIGH e CRITICAL bloqueiam. O socket do Docker só é
      # montado neste passo, só leitura, para o Trivy ler as imagens locais. --ignore-unfixed: achado sem correção
      # publicada não tem bump possível; ele aparece no relatório abaixo e volta a bloquear quando a correção sair.
      - name: Trivy nas imagens (HIGH e CRITICAL corrigíveis bloqueiam)
        run: |
          for image in web worker migrator edge postgres; do
            echo "::group::duora-$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v duora-trivy-cache:/root/.cache \
              -v "$GITHUB_WORKSPACE/.trivyignore:/trivyignore:ro" "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /trivyignore --exit-code 1 "duora-$image:ci"
            echo "::endgroup::"
          done

      # Informativo: nunca decide o resultado do job (por isso continue-on-error), e só faz sentido com as cinco
      # imagens construídas. Roda mesmo se o passo do Trivy acima falhar, para o relatório sair junto. Sem
      # --skip-db-update: se o passo anterior não baixou a base, este baixa (o volume duora-trivy-cache a reaproveita).
      - name: Relatório de vulnerabilidades sem correção (não bloqueia)
        if: ${{ !cancelled() && steps.build-dotnet.outcome == 'success' && steps.build-edge-postgres.outcome == 'success' }}
        continue-on-error: true
        env:
          COUNT_UNFIXED: |
            import json, sys
            try:
                report = json.loads(sys.stdin.read())
            except ValueError:
                print("relatório indisponível")
                sys.exit(0)
            print(sum(1 for result in report.get("Results") or []
                      for vulnerability in result.get("Vulnerabilities") or []
                      if vulnerability.get("Status") != "fixed"))
        run: |
          {
            echo "### Vulnerabilidades HIGH/CRITICAL sem correção publicada (${{ matrix.arch }})"
            for image in web worker migrator edge postgres; do
              count=$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v duora-trivy-cache:/root/.cache \
                "$TRIVY_IMAGE" image --quiet --severity HIGH,CRITICAL --format json "duora-$image:ci" \
                | python3 -c "$COUNT_UNFIXED")
              echo "- duora-$image: $count"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate image SBOMs
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          for image in web worker migrator edge postgres; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v duora-trivy-cache:/root/.cache "$TRIVY_IMAGE" image \
              --format cyclonedx --quiet "duora-$image:ci" > "$RUNNER_TEMP/release/sbom-$image.cdx.json"
          done

      # Only the exact local images already scanned above are pushed; no rebuild after validation.
      - name: Publish scanned images by digest
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/registry-auth"
          mkdir -m 700 "$DOCKER_CONFIG"
          trap 'docker logout ghcr.io >/dev/null 2>&1; rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/duora"
          tag="$RELEASE_COMMIT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$ARCH"
          echo '{}' > "$RUNNER_TEMP/release/images.json"
          for image in web worker migrator edge postgres; do
            reference="$prefix-$image:$tag"
            docker tag "duora-$image:ci" "$reference"
            docker push "$reference"
            digest=$(docker image inspect --format '{{json .RepoDigests}}' "$reference" \
              | jq -er --arg prefix "$prefix-$image@" '.[] | select(startswith($prefix))')
            [[ "$digest" =~ @sha256:[0-9a-f]{64}$ ]]
            jq --arg image "$image" --arg digest "$digest" '. + {($image): $digest}' \
              "$RUNNER_TEMP/release/images.json" > "$RUNNER_TEMP/release/images.next.json"
            mv "$RUNNER_TEMP/release/images.next.json" "$RUNNER_TEMP/release/images.json"
          done
          jq -n --arg commit "$RELEASE_COMMIT" --arg architecture "$ARCH" \
            --arg ciRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$CI_RUN/attempts/$CI_ATTEMPT" \
            --arg publishRun "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
            --slurpfile images "$RUNNER_TEMP/release/images.json" \
            '{commit: $commit, architecture: $architecture, ciRun: $ciRun, publishRun: $publishRun, images: $images[0]}' \
            > "$RUNNER_TEMP/release/publication.json"
          cat "$RUNNER_TEMP/release/publication.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digests and SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 90
