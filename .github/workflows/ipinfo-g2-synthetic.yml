# G2 preparation with synthetic fixtures. The manual provider rehearsal calls this workflow first.
name: IPinfo Lite G2 synthetic

on:
  pull_request:
    paths:
      - .github/workflows/ipinfo-g2.yml
      - .github/workflows/ipinfo-g2-synthetic.yml
      - tools/IpinfoG2/**
      - scripts/geolocation/**
      - backend/src/Duora.Infrastructure/Geolocation/**
      - backend/src/Duora.Core/Geolocation/**
      - backend/tests/Duora.IntegrationTests/Geolocation/SyntheticMmdb.cs
      - Directory.Build.props
      - Directory.Packages.props
      - global.json
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ipinfo-g2-synthetic-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  synthetic:
    name: g2-synthetic
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: python3 -m unittest discover -s scripts/geolocation -v
      - run: dotnet restore tools/IpinfoG2/IpinfoG2.csproj --locked-mode
      - run: dotnet build tools/IpinfoG2/IpinfoG2.csproj --no-restore
      - run: dotnet run --project tools/IpinfoG2/IpinfoG2.csproj --no-build -- --self-test
      - run: dotnet format tools/IpinfoG2/IpinfoG2.csproj --verify-no-changes --no-restore
