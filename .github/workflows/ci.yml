# Gates de PR e da main (spec 17.1). Área protegida: mudar este arquivo é mudança de política (spec 14.3).
# Actions de terceiros fixadas por SHA completo (D-CI-01); o Dependabot (github-actions) atualiza SHA e comentário.
name: CI

on:
  pull_request:
    # labeled/unlabeled: o job contract lê o label breaking-change-approved do evento; pôr ou tirar o label
    # reroda o CI inteiro (o concurrency cancela a execução anterior, então nenhum check fica sem rodar).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# Mínimo no topo; nenhum job precisa de mais que leitura do código (spec 17.1, D-CI-01).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NODE_VERSION: "24"
  # Ferramentas em container, fixadas por digest do índice multi-arquitetura (docs/security/supply-chain.md).
  # Trivy: assinatura cosign do digest conferida contra os workflows de release de aquasecurity/trivy.
  TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
  # Prefer the official DB; Trivy does not fall back for every mirror HTTP 404.
  TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,mirror.gcr.io/aquasec/trivy-db:2
  # oasdiff: a imagem não é assinada; o digest foi lido da tag v1.33.0 e fica fixo até a próxima revisão.
  OASDIFF_IMAGE: tufin/oasdiff:v1.33.0@sha256:6263a96dd2ef0726c54e21fea9b8e1607eac4841add0079324b424c1f52b819c

jobs:
  # A suíte passou de 40 min em um runner só por tamanho, não por teste preso (#507). Soma do tempo de teste no corte
  # do #503, por shard: Identity A–L ~25 min, Identity M–Z ~26, Media ~29, Participation + Profiles ~23, resto ~30
  # (Safety e os projetos de unidade, arquitetura e corpus). Identity é um namespace só e divide pela inicial da
  # classe. Cada shard é um runner próprio. "identity-m-z" e "resto" são complementos (namespace menos o que outro
  # shard pegou), então classe ou namespace novo cai num deles e nenhum teste fica de fora.
  backend-tests:
    name: backend (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: identity-a-l
            target: --project backend/tests/Duora.IntegrationTests/Duora.IntegrationTests.csproj
            filter: >-
              --filter-class "Duora.IntegrationTests.Identity.A*" --filter-class "Duora.IntegrationTests.Identity.B*" --filter-class "Duora.IntegrationTests.Identity.C*" --filter-class "Duora.IntegrationTests.Identity.D*" --filter-class "Duora.IntegrationTests.Identity.E*" --filter-class "Duora.IntegrationTests.Identity.F*" --filter-class "Duora.IntegrationTests.Identity.G*" --filter-class "Duora.IntegrationTests.Identity.H*" --filter-class "Duora.IntegrationTests.Identity.I*" --filter-class "Duora.IntegrationTests.Identity.J*" --filter-class "Duora.IntegrationTests.Identity.K*" --filter-class "Duora.IntegrationTests.Identity.L*"
          - shard: identity-m-z
            target: --project backend/tests/Duora.IntegrationTests/Duora.IntegrationTests.csproj
            filter: >-
              --filter-namespace "Duora.IntegrationTests.Identity*"
              --filter-not-class "Duora.IntegrationTests.Identity.A*"
              --filter-not-class "Duora.IntegrationTests.Identity.B*"
              --filter-not-class "Duora.IntegrationTests.Identity.C*"
              --filter-not-class "Duora.IntegrationTests.Identity.D*"
              --filter-not-class "Duora.IntegrationTests.Identity.E*"
              --filter-not-class "Duora.IntegrationTests.Identity.F*"
              --filter-not-class "Duora.IntegrationTests.Identity.G*"
              --filter-not-class "Duora.IntegrationTests.Identity.H*"
              --filter-not-class "Duora.IntegrationTests.Identity.I*"
              --filter-not-class "Duora.IntegrationTests.Identity.J*"
              --filter-not-class "Duora.IntegrationTests.Identity.K*"
              --filter-not-class "Duora.IntegrationTests.Identity.L*"
          - shard: media
            target: --project backend/tests/Duora.IntegrationTests/Duora.IntegrationTests.csproj
            filter: --filter-namespace "Duora.IntegrationTests.Media*"
          - shard: participation-profiles
            target: --project backend/tests/Duora.IntegrationTests/Duora.IntegrationTests.csproj
            filter: --filter-namespace "Duora.IntegrationTests.Participation*" --filter-namespace "Duora.IntegrationTests.Profiles*"
          - shard: resto
            target: --solution backend/Duora.slnx
            filter: >-
              --filter-not-namespace "Duora.IntegrationTests.Identity*"
              --filter-not-namespace "Duora.IntegrationTests.Media*"
              --filter-not-namespace "Duora.IntegrationTests.Participation*"
              --filter-not-namespace "Duora.IntegrationTests.Profiles*"
    steps:
      - name: Registrar arquitetura do runner (spec 2.4)
        run: |
          echo "uname -m: $(uname -m)"
          echo "Runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      # Informativo: compara o hardware entre execuções; não pode reprovar o job.
      - name: Registrar CPU do runner
        continue-on-error: true
        run: lscpu

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore (lockfile obrigatório)
        run: dotnet restore backend/Duora.slnx --locked-mode

      - name: Build (avisos são erros)
        run: dotnet build backend/Duora.slnx --no-restore

      - name: Formatação
        if: ${{ matrix.shard == 'resto' }}
        run: dotnet format backend/Duora.slnx --verify-no-changes --no-restore

      # Unidade, arquitetura e integração; Testcontainers usa o Docker do runner (PostgreSQL 18 real).
      # Sem limite interno: quem corta é o timeout-minutes do shard.
      # O TRX só é gravado no fim do módulo e não existe no corte; o .diag em Trace identifica o teste que ficou
      # em andamento (InProgress sem resultado).
      - name: Testes
        run: |
          results="$RUNNER_TEMP/backend-test-results"
          # shellcheck disable=SC2086 # target e filter são listas de argumentos fixas da matrix.
          dotnet test ${{ matrix.target }} --no-build \
            --report-xunit-trx --results-directory "$results" \
            --diagnostic --diagnostic-verbosity Trace --diagnostic-output-directory "$results" \
            -- ${{ matrix.filter }}

      # Duora.MediaCorpusTests compila fontes de IntegrationTests/Media (namespace Duora.IntegrationTests.Media).
      # O "resto" exclui esse namespace em toda a solução, então esses casos rodam aqui. Sem nenhum caso, o
      # dotnet test sai com código 8 e o shard falha.
      - name: Testes do corpus de mídia no namespace Media
        if: ${{ matrix.shard == 'media' }}
        run: |
          results="$RUNNER_TEMP/backend-test-results"
          dotnet test --project backend/tests/Duora.MediaCorpusTests/Duora.MediaCorpusTests.csproj --no-build \
            --report-xunit-trx --results-directory "$results" \
            --diagnostic --diagnostic-verbosity Trace --diagnostic-output-directory "$results" \
            -- --filter-namespace "Duora.IntegrationTests.Media*"

      # Tempo de parede por classe e testes ainda abertos, em verde também (#507): só nomes de teste e tempos vão
      # para o resumo do job, nunca o .diag. Informativo: não muda o veredito.
      - name: Tempo por classe de teste
        if: ${{ always() }}
        continue-on-error: true
        run: python3 -I scripts/ci/diag_durations.py "$RUNNER_TEMP"/backend-test-results/*.diag >> "$GITHUB_STEP_SUMMARY"

      # Só em falha ou corte: nada de verde sobe para um repositório público. O upload não muda o veredito do job.
      - name: Preservar telemetria dos testes
        if: ${{ failure() || cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-telemetry-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/backend-test-results/*.trx
            ${{ runner.temp }}/backend-test-results/*.diag
          if-no-files-found: warn
          retention-days: 7

      # Preserve the already built/tested standalone outputs; no decoder rebuild or host action.
      - name: Package standalone media instrumentation
        if: ${{ matrix.shard == 'resto' }}
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          python3 scripts/media/instrumentation_bundle.py --root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/media-host-instrumentation" \
            --commit "$commit" --tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --architecture "$(uname -m)"

      - name: Preserve standalone media instrumentation
        if: ${{ matrix.shard == 'resto' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: media-host-instrumentation-amd64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/media-host-instrumentation/
          if-no-files-found: error
          retention-days: 90

  # A proteção da main exige o check "backend": ele só passa se todos os shards passaram.
  backend:
    name: backend
    needs: backend-tests
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Todos os shards do backend passaram
        env:
          RESULT: ${{ needs.backend-tests.result }}
        run: |
          echo "Shards do backend: $RESULT"
          test "$RESULT" = success

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Depois do checkout: o defaults.run.working-directory (frontend) só existe a partir daqui.
      - name: Registrar arquitetura do runner (spec 2.4)
        run: |
          echo "uname -m: $(uname -m)"
          echo "Runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # O cache do pnpm é feito abaixo, depois do Corepack, porque o pnpm só existe a partir daí.
          package-manager-cache: false

      - name: Ativar pnpm via Corepack (packageManager do package.json)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    # Era 25. Os dois passos do Playwright, no pior caso de retry (3 tentativas com teto e esperas de 15 s e 45 s),
    # somam ~23 min e consumiriam o job antes dos testes; +15 min deixam a folga que o E2E tinha.
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Depois do checkout: o defaults.run.working-directory (frontend) só existe a partir daqui.
      - name: Registrar arquitetura do runner (spec 2.4)
        run: |
          echo "uname -m: $(uname -m)"
          echo "Runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Ativar pnpm via Corepack (packageManager do package.json)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      # Hosted Ubuntu uses this mirror list. Keep all signed Ubuntu sources and prefer the upstream archive.
      - name: Preferir archive Ubuntu para dependências dos navegadores
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:3\n' \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null

      # Navegadores não vão para o cache: os pacotes do sistema (install-deps) o cache não restauraria.
      # Dois passos com teto próprio: um mirror que trava (como o azure.archive.ubuntu.com) falha em minutos, não
      # nos 25 do job. Cada tentativa tem teto; falha transitória repete 3 vezes (15 s, 45 s), a persistente falha.
      # Antes de repetir, o apt troca os espelhos *.ubuntu.com pelos de fallback e conclui o dpkg (apt_recover_install).
      - name: Instalar dependências de sistema dos navegadores do Playwright
        timeout-minutes: 12
        env:
          CI_RETRY_ATTEMPT_TIMEOUT: '180'
          CI_RETRY_RECOVER: apt_recover_install
        run: |
          source "$GITHUB_WORKSPACE/scripts/ci/apt-retry.sh"
          apt_configure_network
          apt_prefer_reachable_mirror
          retry_with_backoff pnpm exec playwright install-deps chromium webkit

      - name: Instalar navegadores do Playwright
        timeout-minutes: 15
        env:
          CI_RETRY_ATTEMPT_TIMEOUT: '240'
        run: |
          source "$GITHUB_WORKSPACE/scripts/ci/apt-retry.sh"
          retry_with_backoff pnpm exec playwright install chromium webkit

      # CI=true (definido pelo Actions): o Playwright sobe o próprio servidor e não reaproveita um existente.
      - name: E2E
        run: pnpm e2e

      - name: Publicar relatório do Playwright (só em falha)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Valida os Dockerfiles da release na arquitetura nativa de cada runner (spec 2.4: emulação não é prova).
  # Só build, sem push: registry e publicação dependem da VPS (docs/operations/deploy.md).
  images:
    name: images (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      PLATFORM: linux/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Registrar arquitetura do runner (spec 2.4)
        run: |
          echo "uname -m: $(uname -m)"
          echo "Runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      - name: Qualify the reviewed PostgreSQL runtime without rebuilding it
        id: postgres-component
        uses: ./.github/actions/postgres-component
        with:
          architecture: ${{ matrix.arch }}
          token: ${{ github.token }}

      # Licença da Six Labors (ADR-0025, docs/operations/deploy.md): o build Release do worker a recebe como secret do
      # BuildKit, lido da variável do passo, sem ARG nem ENV na imagem. Sem o secret (PR de fork; PR do Dependabot sem o
      # secret do Dependabot) o job falha com mensagem, em vez de pular: images verde quer dizer imagens de release
      # construídas e varridas, e um build pulado passaria pelo gate sem a imagem que vai para produção.
      - name: Build web, worker e migrator
        id: build-dotnet
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: |
          license=()
          if grep -q 'id=sixlabors_license' infra/images/dotnet/Dockerfile; then
            if [ -z "$SIXLABORS_LICENSE_KEY" ]; then
              echo "::error::Secret SIXLABORS_LICENSE_KEY ausente: o build Release do worker exige a licença da Six Labors. PR de fork não recebe secrets; PR do Dependabot precisa do secret de mesmo nome em Settings > Secrets > Dependabot (docs/operations/deploy.md)."
              exit 1
            fi
            license=(--secret "id=sixlabors_license,env=SIXLABORS_LICENSE_KEY")
          fi
          for target in web worker migrator; do
            docker buildx build --file infra/images/dotnet/Dockerfile --target "$target" --platform "$PLATFORM" \
              --build-arg GIT_COMMIT="$GITHUB_SHA" --tag "duora-$target:ci" "${license[@]}" --load .
          done

      # A chave não pode ter ficado em camada, histórico nem arquivo da imagem (o script nunca a imprime). Só depois que
      # o Dockerfile passa a usar o secret e o verificador existe no repositório.
      - name: Conferir que a licença não ficou na imagem do worker
        if: ${{ hashFiles('scripts/supply-chain/check_image_secret.py') != '' }}
        env:
          SIXLABORS_LICENSE_KEY: ${{ secrets.SIXLABORS_LICENSE_KEY }}
        run: python3 scripts/supply-chain/check_image_secret.py duora-worker:ci SIXLABORS_LICENSE_KEY

      - name: Build edge with the qualified PostgreSQL component retained
        id: build-edge-postgres
        run: |
          docker buildx build --file infra/images/edge/Dockerfile --platform "$PLATFORM" \
            --build-arg GIT_COMMIT="$GITHUB_SHA" --tag duora-edge:ci --load .

      # Executa cada binário nativo na arquitetura do runner, sem subir o ambiente.
      - name: Verificar as imagens
        run: |
          docker run --rm --entrypoint /app/efbundle duora-migrator:ci --help > /dev/null
          docker run --rm duora-postgres:ci pgbackrest version
          DUORA_POSTGRES_IMAGE=duora-postgres:ci python3 -m unittest discover -s scripts/deploy \
            -p 'test_db_privileges.py' -v
          docker run --rm -e DUORA_DOMAIN=app.example.com -e DUORA_TLS=ops@example.com \
            --entrypoint caddy duora-edge:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
          for image in web worker migrator edge; do
            echo "duora-$image: $(docker image inspect --format '{{.Architecture}} user={{.Config.User}}' "duora-$image:ci")"
          done

      # Spec 18.5: backup físico, WAL e restore PITR de ponta a ponta com o compose.prod.yml real e um MinIO só como
      # dublê S3 (docs/operations/backup-restore.md). Prova também que o postgres não alcança a internet.
      - name: Drill de restore (pgBackRest + MinIO de teste)
        # bash do Actions roda com -o pipefail: uma falha do drill não some atrás do tee.
        shell: bash
        run: |
          python3 scripts/backup/restore_drill.py --image duora-postgres:ci | tee "$RUNNER_TEMP/drill.log"
          { echo "### Drill de restore (${{ matrix.arch }})"; grep '^\[drill\] OK' "$RUNNER_TEMP/drill.log"; } \
            >> "$GITHUB_STEP_SUMMARY"

      # Spec 17.1: vulnerabilidades das imagens (SO e binários), HIGH e CRITICAL bloqueiam. O socket do Docker só é
      # montado neste passo, só leitura, para o Trivy ler as imagens locais. --ignore-unfixed: achado sem correção
      # publicada não tem bump possível; ele aparece no relatório abaixo e volta a bloquear quando a correção sair.
      - name: Trivy nas imagens (HIGH e CRITICAL corrigíveis bloqueiam)
        run: |
          for image in web worker migrator edge postgres; do
            echo "::group::duora-$image"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v duora-trivy-cache:/root/.cache \
              -v "$GITHUB_WORKSPACE/.trivyignore:/trivyignore:ro" -e TRIVY_DB_REPOSITORY "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL --ignore-unfixed --ignorefile /trivyignore --exit-code 1 "duora-$image:ci"
            echo "::endgroup::"
          done

      # Informativo: nunca decide o resultado do job (por isso continue-on-error), e só faz sentido com as cinco
      # imagens construídas. Roda mesmo se o passo do Trivy acima falhar, para o relatório sair junto. Sem
      # --skip-db-update: se o passo anterior não baixou a base, este baixa (o volume duora-trivy-cache a reaproveita).
      - name: Relatório de vulnerabilidades sem correção (não bloqueia)
        if: ${{ !cancelled() && steps.build-dotnet.outcome == 'success' && steps.build-edge-postgres.outcome == 'success' }}
        continue-on-error: true
        env:
          COUNT_UNFIXED: |
            import json, sys
            try:
                report = json.loads(sys.stdin.read())
            except ValueError:
                print("relatório indisponível")
                sys.exit(0)
            print(sum(1 for result in report.get("Results") or []
                      for vulnerability in result.get("Vulnerabilities") or []
                      if vulnerability.get("Status") != "fixed"))
        run: |
          {
            echo "### Vulnerabilidades HIGH/CRITICAL sem correção publicada (${{ matrix.arch }})"
            for image in web worker migrator edge postgres; do
              count=$(docker run --rm -v /var/run/docker.sock:/var/run/docker.sock:ro -v duora-trivy-cache:/root/.cache \
                -e TRIVY_DB_REPOSITORY "$TRIVY_IMAGE" image --quiet --severity HIGH,CRITICAL --format json "duora-$image:ci" \
                | python3 -c "$COUNT_UNFIXED")
              echo "- duora-$image: $count"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve PostgreSQL component transport evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgres-component-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/postgres-component/plan.json
            ${{ runner.temp }}/postgres-component/source-plan.json
            ${{ runner.temp }}/postgres-component/qualification.json
            ${{ runner.temp }}/postgres-component/docker-runtime-before.json
            ${{ runner.temp }}/postgres-component/docker-api-before.json
            ${{ runner.temp }}/postgres-component/docker-runtime-after.json
            ${{ runner.temp }}/postgres-component/docker-api-after.json
            ${{ runner.temp }}/postgres-component/docker-store.json
          if-no-files-found: warn
          retention-days: 90

      - name: Preserve qualified executor bundle and disposable continuity evidence
        if: ${{ !cancelled() && hashFiles('scripts/deploy/continuity_lab.py') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: duora-executor-${{ matrix.arch }}
          path: ${{ runner.temp }}/duora-executor-lab/${{ matrix.arch }}/
          if-no-files-found: error
          retention-days: 90

  # Ferramentas Python do repositório (scripts de operação, Ansible e pipeline de ilustrações): testes, tipos e lint
  # com versões fixadas.
  ops:
    name: ops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      # Critério de versão do Python neste repositório:
      #  - Tooling que só roda no runner (ansible-core 2.22, ansible-lint, pyright, pipeline de ilustrações, verificadores
      #    de supply chain, ensaios): Python 3.14.10 exato por actions/setup-python (o ansible-core 2.22 exige 3.13+).
      #  - Código que executa no Python do HOST da VPS (duora-deploy, duora-backup, validador da chave do apt): os testes
      #    rodam no python3 do sistema do Ubuntu 24.04 (3.12), a mesma versão da VPS. É o que ela roda até o dono
      #    atualizá-la. Esses passos chamam /usr/bin/python3 de propósito e conferem que é 3.12; os jobs backend e images
      #    não usam setup-python pelo mesmo motivo.
      # O pyright segue com pythonVersion 3.12 (pyrightconfig.json) para barrar sintaxe e API que a VPS não tem.
      # Os passos abaixo dependem só da instalação de que precisam (if com steps.*.outcome): uma falha no venv
      # visual não esconde o resultado das ferramentas de operação, e vice-versa. A falha continua reprovando o job.
      - name: Ferramentas fixadas
        id: ops-tools
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          # Lockfile com hashes (scripts/deploy/requirements.txt): pacote ou dependência transitiva com hash
          # diferente do versionado aborta a instalação. --only-binary: só wheels, nenhum build de sdist roda no job.
          "$RUNNER_TEMP/venv/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r scripts/deploy/requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      # Venv próprio: o Pillow do tooling visual não se mistura com as ferramentas de operação (e vice-versa).
      - name: Dependências do pipeline de ilustrações
        id: visual-deps
        if: ${{ !cancelled() }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv-visual"
          "$RUNNER_TEMP/venv-visual/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r tools/visual/requirements.txt

      - name: Testes do pipeline de ilustrações
        if: ${{ !cancelled() && steps.visual-deps.outcome == 'success' }}
        run: |
          "$RUNNER_TEMP/venv-visual/bin/python" -m unittest discover -s tools/visual -v

      # --pythonpath: o pyright resolve o Pillow pelo venv do tooling visual, não pelo das ferramentas de operação.
      - name: Pyright do pipeline de ilustrações
        if: ${{ !cancelled() && steps.ops-tools.outcome == 'success' && steps.visual-deps.outcome == 'success' }}
        run: pyright -p tools/visual/pyrightconfig.json --pythonpath "$RUNNER_TEMP/venv-visual/bin/python" tools/visual

      # Venv do Python do host (3.12 do sistema) só com o que os testes importam e os scripts da VPS não usam: PyYAML e o
      # pyright (test_telemetry_types chama `python -m pyright`) com suas dependências. Pins e hashes saem do mesmo
      # lockfile do tooling, para nada entrar sem hash. O assert protege o critério acima.
      - name: Python do host da VPS (3.12) para os testes
        id: host-py
        if: ${{ !cancelled() }}
        run: |
          /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv-host"
          awk '/^(pyyaml|pyright|nodeenv|typing-extensions)==/ {keep=1; print; next} keep && /^ +--hash=/ {print; next} {keep=0}' \
            scripts/deploy/requirements.txt > "$RUNNER_TEMP/host-requirements.txt"
          test -s "$RUNNER_TEMP/host-requirements.txt"
          "$RUNNER_TEMP/venv-host/bin/pip" install --quiet --require-hashes --only-binary=:all: \
            -r "$RUNNER_TEMP/host-requirements.txt"

      - name: Testes dos scripts de deploy (Python 3.12 do host)
        if: ${{ !cancelled() && steps.host-py.outcome == 'success' }}
        run: '"$RUNNER_TEMP/venv-host/bin/python" -m unittest discover -s scripts/deploy -v'

      - name: Testes do validador da chave do apt (role docker, Python 3.12 do host)
        if: ${{ !cancelled() && steps.host-py.outcome == 'success' }}
        run: '"$RUNNER_TEMP/venv-host/bin/python" -m unittest discover -s infra/ansible/roles/docker/files -v'

      - name: Pyright
        if: ${{ !cancelled() && steps.ops-tools.outcome == 'success' }}
        run: pyright -p scripts/deploy/pyrightconfig.json scripts/deploy scripts/backup scripts/ci infra/ansible/roles/docker/files

      - name: ansible-lint e syntax-check
        if: ${{ !cancelled() && steps.ops-tools.outcome == 'success' }}
        working-directory: infra/ansible
        run: |
          ansible-galaxy collection install -r requirements.yml
          ansible-lint
          ansible-playbook -i inventory/example.yml site.yml --syntax-check
          ansible-playbook -i inventory/example.yml media-sanitizer.yml --syntax-check

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # histórico inteiro: segredo removido num commit posterior continua vazado

      # Imagem oficial fixada por digest (índice multi-arquitetura) em vez da gitleaks-action:
      # dispensa token e licença e não executa JavaScript de terceiros no job.
      # --log-opts=HEAD: varre todo o histórico alcançável do commit testado (no PR, o merge commit), não os
      # outros refs que o fetch-depth 0 traz. Sem isso o padrão é `git log --all`, e um achado na branch de
      # outro PR derruba o secret-scan de todos.
      - name: Gitleaks (histórico do git)
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --log-opts=HEAD --redact --verbose --exit-code 1

  # Contrato (spec 17.1, ADR-0018, docs/api/README.md): o OpenAPI e os tipos da SPA gerados batem com o commit,
  # e o PR não traz breaking change sem aprovação explícita.
  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # o oasdiff lê o openapi.json do commit base do PR

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      # O build do Duora.Web regenera docs/api/openapi.json (Microsoft.Extensions.ApiDescription.Server).
      - name: Gerar o OpenAPI (build do Duora.Web)
        run: |
          dotnet restore backend/src/Duora.Web/Duora.Web.csproj --locked-mode
          dotnet build backend/src/Duora.Web/Duora.Web.csproj --no-restore

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Ativar pnpm via Corepack (packageManager do package.json)
        working-directory: frontend
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Gerar os tipos da SPA (openapi-typescript)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm api:generate

      - name: Artefatos gerados batem com o commit
        run: |
          generated=(docs/api frontend/src/shared/api)
          git diff --stat -- "${generated[@]}"
          untracked="$(git status --porcelain --untracked-files=all -- "${generated[@]}")"
          if ! git diff --quiet --exit-code -- "${generated[@]}" || [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::Contrato ou tipos gerados divergem do commit. Rode 'dotnet build' no backend e 'pnpm api:generate' no frontend e versione o resultado (docs/api/README.md)."
            exit 1
          fi

      # Só em PR: na main, a mudança já foi aprovada no PR. O label vem do payload do evento via env, sem
      # interpolar dados do evento no script; só quem tem triage ou write no repositório consegue aplicá-lo.
      - name: Breaking changes contra a base do PR (oasdiff)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BREAKING_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'breaking-change-approved') }}
        run: |
          spec=docs/api/openapi.json
          if ! git cat-file -e "$BASE_SHA:$spec" 2>/dev/null; then
            echo "::notice::A base do PR ainda não tem $spec; nada a comparar."
            exit 0
          fi
          specs="$RUNNER_TEMP/oasdiff"
          mkdir -p "$specs"
          git show "$BASE_SHA:$spec" > "$specs/base.json"
          cp "$spec" "$specs/head.json"
          oasdiff() { docker run --rm -v "$specs:/specs:ro" -w /specs "$OASDIFF_IMAGE" "$@"; }

          # Primeiro sem --fail-on: documento ilegível falha aqui e nunca passa por breaking change aprovada.
          {
            echo "### Changelog do contrato (oasdiff)"
            echo '```'
            oasdiff changelog base.json head.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if oasdiff breaking base.json head.json --fail-on ERR; then
            echo "Nenhuma breaking change no contrato."
          elif [ "$BREAKING_APPROVED" = "true" ]; then
            echo "::warning::Breaking change aprovada pelo label breaking-change-approved. Registre a transição no PR (spec 8.1)."
          else
            echo "::error::Breaking change no contrato. Torne a mudança compatível ou, com decisão explícita, aplique o label breaking-change-approved (docs/api/README.md)."
            exit 1
          fi

  # Supply chain (spec 2.3 e 17.1, docs/security/supply-chain.md): vulnerabilidades de dependências e misconfig
  # com Trivy, SBOM CycloneDX e inventário de licenças contra a allowlist. Segredos ficam com o secret-scan.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'

      - name: Testes dos verificadores
        run: python3 -m unittest discover -s scripts/supply-chain -v

      - name: Exceções do .trivyignore têm justificativa e validade
        run: python3 scripts/supply-chain/check_trivyignore.py .trivyignore

      # O restore e o install populam ~/.nuget/packages e node_modules, de onde o Trivy lê as licenças.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore (lockfile obrigatório)
        run: dotnet restore backend/Duora.slnx --locked-mode

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Ativar pnpm via Corepack (packageManager do package.json)
        working-directory: frontend
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install (lockfile obrigatório)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Gerar SBOMs CycloneDX (backend e frontend)
        run: |
          mkdir -p "$RUNNER_TEMP/sbom"
          for part in backend frontend; do
            docker run --rm \
              -e NUGET_PACKAGES=/nuget \
              -v "$HOME/.nuget/packages:/nuget:ro" \
              -v "$GITHUB_WORKSPACE:/repo:ro" \
              -v "$RUNNER_TEMP/sbom:/sbom" \
              -w /repo \
              -e TRIVY_DB_REPOSITORY "$TRIVY_IMAGE" fs "$part" \
              --format cyclonedx --include-dev-deps --quiet \
              --output "/sbom/sbom-$part.cdx.json"
          done
          ls -l "$RUNNER_TEMP/sbom"

      - name: Publicar SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: ${{ runner.temp }}/sbom/
          retention-days: 30
          if-no-files-found: error

      - name: Licenças contra a allowlist
        shell: bash
        run: |
          python3 scripts/supply-chain/check_licenses.py scripts/supply-chain/license-policy.json \
            "$RUNNER_TEMP"/sbom/*.cdx.json | tee -a "$GITHUB_STEP_SUMMARY"

      # Roda mesmo se a checagem de licenças falhar, para o PR mostrar todos os achados de uma vez.
      - name: Vulnerabilidades e misconfig (HIGH e CRITICAL bloqueiam)
        if: ${{ !cancelled() }}
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo:ro"
          -w /repo
          -e TRIVY_DB_REPOSITORY "$TRIVY_IMAGE" fs .
          --scanners vuln,misconfig
          --severity HIGH,CRITICAL
          --include-dev-deps
          --ignorefile .trivyignore
          --exit-code 1

