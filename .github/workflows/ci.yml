# Gates de PR e da main (spec 17.1). Área protegida: mudar este arquivo é mudança de política (spec 14.3).
# Actions de terceiros fixadas por SHA completo (D-CI-01); o Dependabot (github-actions) atualiza SHA e comentário.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Mínimo no topo; nenhum job precisa de mais que leitura do código (spec 17.1, D-CI-01).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NODE_VERSION: "24"

jobs:
  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Registrar arquitetura do runner (spec 2.4)
        run: |
          echo "uname -m: $(uname -m)"
          echo "Runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: backend/**/packages.lock.json

      - name: Restore (lockfile obrigatório)
        run: dotnet restore backend/Duora.slnx --locked-mode

      - name: Build (avisos são erros)
        run: dotnet build backend/Duora.slnx --no-restore

      - name: Formatação
        run: dotnet format backend/Duora.slnx --verify-no-changes --no-restore

      # Unidade, arquitetura e integração; Testcontainers usa o Docker do runner (PostgreSQL 18 real).
      - name: Testes
        run: dotnet test --solution backend/Duora.slnx --no-build

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Registrar arquitetura do runner (spec 2.4)
        run: |
          echo "uname -m: $(uname -m)"
          echo "Runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          # O cache do pnpm é feito abaixo, depois do Corepack, porque o pnpm só existe a partir daí.
          package-manager-cache: false

      - name: Ativar pnpm via Corepack (packageManager do package.json)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Registrar arquitetura do runner (spec 2.4)
        run: |
          echo "uname -m: $(uname -m)"
          echo "Runner: $(. /etc/os-release && echo "$PRETTY_NAME"), $(uname -m)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Ativar pnpm via Corepack (packageManager do package.json)
        run: |
          corepack enable
          pnpm --version
          echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-

      - run: pnpm install --frozen-lockfile

      # Navegadores não vão para o cache: --with-deps instala pacotes do sistema que o cache não restauraria.
      - name: Instalar navegadores do Playwright
        run: pnpm exec playwright install --with-deps chromium webkit

      # CI=true (definido pelo Actions): o Playwright sobe o próprio servidor e não reaproveita um existente.
      - name: E2E
        run: pnpm e2e

      - name: Publicar relatório do Playwright (só em falha)
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # histórico inteiro: segredo removido num commit posterior continua vazado

      # Imagem oficial fixada por digest (índice multi-arquitetura) em vez da gitleaks-action:
      # dispensa token e licença e não executa JavaScript de terceiros no job.
      - name: Gitleaks (histórico do git)
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose --exit-code 1
