name: Reviewed PostgreSQL component
description: Reuse the qualified native runtime; refuse drift or expired provenance before publication.
inputs:
  architecture:
    description: Native Linux architecture, amd64 or arm64
    required: true
  token:
    description: Ephemeral job token with actions and packages read access
    required: true
outputs:
  image:
    description: Exact reviewed native PostgreSQL repository digest
    value: ${{ steps.plan.outputs.image }}
runs:
  using: composite
  steps:
    - name: Select the reviewed runtime without rebuilding it
      id: plan
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        COMPONENT_ARCH: ${{ inputs.architecture }}
      run: |
        mkdir -p "$RUNNER_TEMP/postgres-component"
        python3 scripts/release/postgres_component.py select \
          --lock infra/images/postgres-component-lock.json --architecture "$COMPONENT_ARCH" \
          > "$RUNNER_TEMP/postgres-component/plan.json"
        jq -r '"image=" + .image, "run_id=" + (.run_id|tostring),
          "attempt=" + (.attempt|tostring), "source_commit=" + .source_commit' \
          "$RUNNER_TEMP/postgres-component/plan.json" >> "$GITHUB_OUTPUT"

    - name: Match the disposable AMD64 daemon to the reviewed ingress runtime
      if: ${{ inputs.architecture == 'amd64' }}
      shell: bash
      env:
        TARGET_ENGINE_VERSION: '29.9.1'
        TARGET_CONTAINERD_VERSION: '2.4.2'
      run: |
        docker version --format '{{json .}}' > "$RUNNER_TEMP/postgres-component/docker-runtime-before.json"
        before_status=$(curl --silent --show-error --unix-socket /var/run/docker.sock \
          --output "$RUNNER_TEMP/postgres-component/docker-api-before.json" --write-out '%{http_code}' \
          http://localhost/v1.52/version)
        echo "Docker API 1.52 before fixture setup: $before_status"
        sudo install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o "$RUNNER_TEMP/component-docker.asc"
        fingerprint=$(gpg --show-keys --with-colons "$RUNNER_TEMP/component-docker.asc" | awk -F: '$1=="fpr" {print $10; exit}')
        test "$fingerprint" = 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
        sudo install -m 0644 "$RUNNER_TEMP/component-docker.asc" /etc/apt/keyrings/duora-component-docker.asc
        apt_root=$(mktemp -d /tmp/duora-component-apt.XXXXXX)
        trap 'sudo rm -rf -- "$apt_root"' EXIT
        chmod 0755 "$apt_root"
        mkdir "$apt_root/sources" "$apt_root/lists"
        cp /etc/apt/sources.list.d/ubuntu.sources "$apt_root/sources/ubuntu.sources"
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/duora-component-docker.asc] https://download.docker.com/linux/ubuntu noble stable" > "$apt_root/sources/docker.list"
        apt_options=(-o "Dir::Etc::sourcelist=/dev/null"
          -o "Dir::Etc::sourceparts=$apt_root/sources"
          -o "Dir::State::lists=$apt_root/lists"
          -o "APT::Update::Error-Mode=any")
        sudo apt-get "${apt_options[@]}" update -qq
        engine_package=$(apt-cache "${apt_options[@]}" madison docker-ce | awk -F'|' '{gsub(/ /,"",$2);print $2}' \
          | awk -v prefix="5:$TARGET_ENGINE_VERSION-" 'index($0,prefix)==1 && !found {print;found=1}')
        containerd_package=$(apt-cache "${apt_options[@]}" madison containerd.io | awk -F'|' '{gsub(/ /,"",$2);print $2}' \
          | awk -v prefix="$TARGET_CONTAINERD_VERSION-" 'index($0,prefix)==1 && !found {print;found=1}')
        test -n "$engine_package" && test -n "$containerd_package"
        conflicts=()
        for package in docker.io docker-compose docker-compose-v2 docker-doc podman-docker containerd runc moby-engine moby-cli moby-containerd moby-runc; do
          if dpkg-query -W -f='${Status}' "$package" 2>/dev/null | grep -q 'install ok installed'; then conflicts+=("$package"); fi
        done
        if [ "${#conflicts[@]}" -gt 0 ]; then sudo apt-get "${apt_options[@]}" remove -y "${conflicts[@]}"; fi
        sudo apt-get "${apt_options[@]}" install -y --no-install-recommends \
          "docker-ce=$engine_package" "docker-ce-cli=$engine_package" "containerd.io=$containerd_package" \
          docker-buildx-plugin docker-compose-plugin
        python3 - "$RUNNER_TEMP/component-daemon.json" "$RUNNER_TEMP/postgres-component-docker" <<'PY'
        import json, pathlib, sys
        source=pathlib.Path('/etc/docker/daemon.json')
        config=json.loads(source.read_text()) if source.exists() else {}
        config.setdefault('features', {})['containerd-snapshotter']=True
        config['data-root']=sys.argv[2]
        pathlib.Path(sys.argv[1]).write_text(json.dumps(config))
        PY
        sudo install -m 0644 "$RUNNER_TEMP/component-daemon.json" /etc/docker/daemon.json
        sudo systemctl restart docker
        test "$(readlink -f "$(command -v docker)")" = /usr/bin/docker
        docker version --format '{{json .}}' > "$RUNNER_TEMP/postgres-component/docker-runtime-after.json"
        after_status=$(curl --silent --show-error --unix-socket /var/run/docker.sock \
          --output "$RUNNER_TEMP/postgres-component/docker-api-after.json" --write-out '%{http_code}' \
          http://localhost/v1.52/version)
        test "$after_status" = 200
        docker info --format '{{json .DriverStatus}}' > "$RUNNER_TEMP/postgres-component/docker-store.json"
        python3 - "$RUNNER_TEMP/postgres-component" "$TARGET_ENGINE_VERSION" "$TARGET_CONTAINERD_VERSION" <<'PY'
        import json, pathlib, sys
        root=pathlib.Path(sys.argv[1])
        runtime=json.loads((root/'docker-runtime-after.json').read_text())
        server=json.loads((root/'docker-api-after.json').read_text())
        assert runtime['Client']['Version']==sys.argv[2] and server['Version']==sys.argv[2]
        components={item['Name']:item['Version'] for item in server['Components']}
        assert components['containerd'].removeprefix('v')==sys.argv[3]
        assert tuple(map(int,server['MinAPIVersion'].split('.'))) <= (1,52) <= tuple(map(int,server['ApiVersion'].split('.')))
        assert ['driver-type','io.containerd.snapshotter.v1'] in json.loads((root/'docker-store.json').read_text())
        print('Qualified native engine',server['Version'],'API',server['ApiVersion'],'containerd snapshotter')
        PY

    - name: Require the retained proof from its authenticated source run
      id: metadata
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        GH_TOKEN: ${{ inputs.token }}
        COMPONENT_ARCH: ${{ inputs.architecture }}
        SOURCE_RUN: ${{ steps.plan.outputs.run_id }}
        SOURCE_ATTEMPT: ${{ steps.plan.outputs.attempt }}
      run: |
        gh api "repos/BipoXDXD/duora/actions/runs/$SOURCE_RUN/attempts/$SOURCE_ATTEMPT" \
          > "$RUNNER_TEMP/postgres-component/source-run.json"
        gh api "repos/BipoXDXD/duora/actions/runs/$SOURCE_RUN/artifacts?per_page=100" \
          > "$RUNNER_TEMP/postgres-component/artifacts.json"
        artifact_id=$(python3 scripts/release/postgres_component.py select-proof \
          --lock infra/images/postgres-component-lock.json --architecture "$COMPONENT_ARCH" \
          --inventory-json "$RUNNER_TEMP/postgres-component/artifacts.json")
        echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"

    - name: Download the exact retained native publication
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        artifact-ids: ${{ steps.metadata.outputs.artifact_id }}
        merge-multiple: true
        digest-mismatch: error
        github-token: ${{ inputs.token }}
        repository: BipoXDXD/duora
        run-id: ${{ steps.plan.outputs.run_id }}
        path: ${{ runner.temp }}/postgres-component-native

    - name: Read the runtime inputs from the authenticated source commit
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: BipoXDXD/duora
        ref: ${{ steps.plan.outputs.source_commit }}
        token: ${{ inputs.token }}
        persist-credentials: false
        fetch-depth: 1
        path: .postgres-component-source
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          /.dockerignore
          /infra/images/postgres/

    - name: Bind source inputs, current inputs, artifact and digest
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        COMPONENT_ARCH: ${{ inputs.architecture }}
      run: |
        python3 scripts/release/postgres_component.py select \
          --root "$GITHUB_WORKSPACE/.postgres-component-source" \
          --lock "$GITHUB_WORKSPACE/infra/images/postgres-component-lock.json" \
          --architecture "$COMPONENT_ARCH" > "$RUNNER_TEMP/postgres-component/source-plan.json"
        cmp "$RUNNER_TEMP/postgres-component/plan.json" "$RUNNER_TEMP/postgres-component/source-plan.json"
        python3 scripts/release/postgres_component.py verify-origin \
          --lock infra/images/postgres-component-lock.json --architecture "$COMPONENT_ARCH" \
          --run-json "$RUNNER_TEMP/postgres-component/source-run.json" \
          --publication-json "$RUNNER_TEMP/postgres-component-native/publication.json"

    - name: Authenticate the hosted runner for the immutable component
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Pull and verify the exact native runtime
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        COMPONENT_ARCH: ${{ inputs.architecture }}
        COMPONENT_IMAGE: ${{ steps.plan.outputs.image }}
      run: |
        docker pull --platform "linux/$COMPONENT_ARCH" "$COMPONENT_IMAGE"
        docker tag "$COMPONENT_IMAGE" duora-postgres:ci
        docker image inspect duora-postgres:ci --format '{{json .}}' \
          > "$RUNNER_TEMP/postgres-component/selected-image.json"
        python3 scripts/release/postgres_component.py verify-image \
          --lock infra/images/postgres-component-lock.json --architecture "$COMPONENT_ARCH" \
          --image-json "$RUNNER_TEMP/postgres-component/selected-image.json"

    - name: Prepare the existing pinned OCI transport on the hosted runner
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: '1.26.10'
        cache: false

    - name: Install pinned OCI transport
      shell: bash
      run: go install github.com/google/go-containerregistry/cmd/crane@v0.22.1

    - name: Qualify immutable OCI transport and the actual AMD64 ingress
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        COMPONENT_ARCH: ${{ inputs.architecture }}
        COMPONENT_PROOF_ID: ${{ steps.metadata.outputs.artifact_id }}
      run: |
        python3 scripts/release/qualify_postgres_transport.py \
          --architecture "$COMPONENT_ARCH" --lock infra/images/postgres-component-lock.json \
          --publication "$RUNNER_TEMP/postgres-component-native/publication.json" \
          --run-json "$RUNNER_TEMP/postgres-component/source-run.json" \
          --stage "$RUNNER_TEMP/postgres-component-transport" \
          --evidence "$RUNNER_TEMP/postgres-component/qualification.json" \
          --artifact-id "$COMPONENT_PROOF_ID"
