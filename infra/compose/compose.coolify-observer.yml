# Observador sem portas ou volumes; o executor externo gerencia o runtime.
# Configure DUORA_OBSERVER_IMAGE com o digest imutável da edge da release aprovada.
services:
  deployment-observer:
    image: ${DUORA_OBSERVER_IMAGE:?required immutable edge digest}
    entrypoint: [/bin/sh, -c, 'exec sleep 2147483647']
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 16m
    pids_limit: 16
    # Saúde real do backend e do Caddy, sem portas, volumes ou credenciais.
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -T 5 -O /dev/null http://duora-web:8080/health/ready && wget -q -T 5 --header='Host: meetduora.com' -O /dev/null http://duora-edge-1/"
      interval: 15s
      timeout: 12s
      start_period: 30s
      retries: 3
    networks: [duora_edge]
    labels:
      traefik.enable: 'false'
networks:
  duora_edge:
    external: true
    name: duora_edge
