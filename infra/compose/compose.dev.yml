# PostgreSQL de desenvolvimento local. Não é usado pelos testes (Testcontainers sobe o seu) nem em produção.
# Uso: docs/development/environment.md
name: duora-dev

services:
  postgres:
    # Mesma major de produção, patch fixado; manter igual a PostgresFixture.cs nos testes de integração.
    image: postgres:18.6
    environment:
      POSTGRES_DB: duora
      POSTGRES_USER: duora
      POSTGRES_PASSWORD: ${DUORA_DB_PASSWORD:?defina DUORA_DB_PASSWORD (veja docs/development/environment.md)}
    ports:
      # Só loopback: o banco não fica exposto na rede local.
      - "127.0.0.1:${DUORA_DB_PORT:-55432}:5432"
    volumes:
      # A imagem 18 usa PGDATA=/var/lib/postgresql/18/docker; o volume monta o diretório pai (spec 15.4),
      # o que deixa um upgrade de major usar outro subdiretório sem misturar dados.
      - duora-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duora -d duora"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  duora-pgdata:
