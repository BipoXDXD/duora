# Produção e homologação na VPS (spec 15): Caddy, web, worker, PostgreSQL e o job migrador.
# Não use à mão em produção: o deploy é feito por scripts/deploy/duora-deploy (docs/operations/deploy.md), que
# passa os digests da release e a configuração do host por --env-file.
#
# Variáveis (todas obrigatórias, sem default silencioso):
#   DUORA_*_IMAGE       imagem por digest (registry/repo@sha256:...), vinda do manifesto da release
#   DUORA_SECRETS_DIR   diretório do host com os arquivos de segredo (0700; arquivos 0400 com dono = UID do consumidor)
#   DUORA_DOMAIN        domínio público (produção: meetduora.com); DUORA_TLS: e-mail ACME ou "internal"
#   DUORA_HTTP_PORT / DUORA_HTTPS_PORT   portas publicadas no host (80/443 na VPS)
name: duora

x-logging: &logging
  # Driver local com rotação: uma falha em laço não enche o disco com log (spec 19.2).
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

# Endurecimento comum aos processos da aplicação (spec 15.4).
x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    image: ${DUORA_POSTGRES_IMAGE:?defina DUORA_POSTGRES_IMAGE (digest da release)}
    # Roda direto como o usuário postgres da imagem: o diretório do volume já é dele (modo 1777 na imagem), então o
    # entrypoint não precisa de root nem de capabilities para preparar o PGDATA.
    user: "999:999"
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=100
      - -c
      - idle_in_transaction_session_timeout=60s
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
      DUORA_MIGRATOR_PASSWORD_FILE: /run/secrets/db_migrator_password
      DUORA_APP_PASSWORD_FILE: /run/secrets/db_app_password
      DUORA_BACKUP_PASSWORD_FILE: /run/secrets/db_backup_password
    secrets:
      - postgres_superuser_password
      - db_migrator_password
      - db_app_password
      - db_backup_password
      # Cliente TLS do pgBackRest: o archive_command envia WAL ao container backup. Nenhuma credencial do S3 aqui.
      - pgbackrest_tls_ca.crt
      - pgbackrest_tls_client.crt
      - pgbackrest_tls_client.key
    volumes:
      # PostgreSQL 18: PGDATA=/var/lib/postgresql/18/docker; o volume monta o pai (spec 15.4).
      - pgdata:/var/lib/postgresql
    # Só redes internas, sem saída para fora: data (aplicação e migrador) e pgbackrest (WAL até o backup).
    networks: [data, pgbackrest]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # SIGINT da imagem = fast shutdown; tempo para o checkpoint final antes do SIGKILL.
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      # -h 127.0.0.1: o servidor temporário da inicialização só ouve no socket; pelo TCP o banco só fica pronto
      # depois que os scripts de initdb terminaram.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2560M
          cpus: "2"
          pids: 256

  # Repository host do pgBackRest (spec 18.2 e 18.3; decidido pelo usuário em 2026-10-15): o único container com
  # saída para o S3 e com as credenciais e a senha de criptografia do repositório. Recebe o WAL do postgres por TLS
  # (certificado de cliente obrigatório) e faz os backups lendo o PGDATA só leitura e falando SQL com o papel
  # duora_backup por TCP (scram-sha-256, aceito só do IP deste container). Não compartilha o socket do postgres.
  # Protege a saída para fora e a credencial do S3; NÃO protege contra exclusão: o certificado de cliente do postgres
  # também apaga o repositório pelo servidor TLS. Contra isso, versionamento + Object Lock no bucket (ADR-0023).
  # Mesma imagem do postgres (mesma versão do pgBackRest); os timers do host chamam "docker exec" via duora-backup.
  backup:
    image: ${DUORA_POSTGRES_IMAGE:?defina DUORA_POSTGRES_IMAGE (digest da release)}
    <<: *hardened
    user: "999:999"
    command: ["pgbackrest", "server"]
    environment:
      PGBACKREST_CONFIG: /etc/pgbackrest/pgbackrest-repo.conf
      # Com PGBACKREST_CONFIG fora do padrão o include padrão não vale: repo.conf e cipher.conf vêm daqui.
      PGBACKREST_CONFIG_INCLUDE_PATH: /etc/pgbackrest/conf.d
      # libpq do pgBackRest e do psql do verify: banco por TCP, senha do duora_backup em formato .pgpass.
      PGHOST: postgres
      PGPASSFILE: /run/secrets/pgbackrest_db_pgpass
    secrets: &backup-repo-secrets
      - source: pgbackrest_repo
        target: /etc/pgbackrest/conf.d/repo.conf
      - source: pgbackrest_cipher
        target: /etc/pgbackrest/conf.d/cipher.conf
      - pgbackrest_tls_ca.crt
      - pgbackrest_tls_server.crt
      - pgbackrest_tls_server.key
      - pgbackrest_db_pgpass
    tmpfs:
      # Locks do pgBackRest.
      - /tmp:size=16m,mode=1777
    volumes:
      - pgdata:/var/lib/postgresql:ro
    # pgbackrest: recebe o WAL do postgres, num IP fixo (o único que o pg_hba aceita para duora_backup e o único
    # endereço em que o servidor TLS escuta). backup-egress: saída só para o S3 (filtro DOCKER-USER no host).
    networks:
      pgbackrest:
        ipv4_address: 172.30.21.10
      backup-egress: {}
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "pgbackrest", "server-ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
          pids: 128

  # Job de restore (docs/operations/backup-restore.md): só com "--profile restore run --rm restore ...", com o
  # postgres parado. Igual ao backup, mas com o volume do banco gravável e sem servidor TLS.
  restore:
    image: ${DUORA_POSTGRES_IMAGE:?defina DUORA_POSTGRES_IMAGE (digest da release)}
    profiles: [restore]
    <<: *hardened
    restart: "no"
    user: "999:999"
    entrypoint: ["pgbackrest", "--stanza=duora"]
    environment:
      PGBACKREST_CONFIG: /etc/pgbackrest/pgbackrest-repo.conf
      # Com PGBACKREST_CONFIG fora do padrão o include padrão não vale: repo.conf e cipher.conf vêm daqui.
      PGBACKREST_CONFIG_INCLUDE_PATH: /etc/pgbackrest/conf.d
    secrets: *backup-repo-secrets
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - pgdata:/var/lib/postgresql
    networks: [backup-egress]
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2"
          pids: 128

  web:
    image: ${DUORA_WEB_IMAGE:?defina DUORA_WEB_IMAGE (digest da release)}
    <<: *hardened
    user: "1654:1654"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Lê cada arquivo de /run/secrets como uma chave de configuração (ConnectionStrings__Duora).
      SecretsDirectory: /run/secrets
      # Obrigatórias no boot (docs/security/auth.md): origem da SPA (links de e-mail e CSRF), key ring no volume
      # persistente e a rede edge como único proxy confiável para X-Forwarded-* (ver networks).
      Duora__PublicOrigin: https://${DUORA_DOMAIN:?defina DUORA_DOMAIN}
      DataProtection__KeysDirectory: /home/app/.aspnet/DataProtection-Keys
      ReverseProxy__KnownNetworks__0: 172.30.10.0/24
    secrets:
      - source: duora_app_connection
        target: ConnectionStrings__Duora
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - dataprotection:/home/app/.aspnet/DataProtection-Keys
    # edge: recebe o proxy do Caddy (e sai para o object storage); data: fala com o banco.
    networks: [edge, data]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    # Sem healthcheck de container: a imagem chiseled não tem shell nem cliente HTTP, e o Docker não reinicia
    # container "unhealthy" fora do Swarm. O deploy verifica /health/ready pela rede interna.
    deploy:
      resources:
        limits:
          memory: 1536M
          cpus: "2"
          pids: 512

  worker:
    image: ${DUORA_WORKER_IMAGE:?defina DUORA_WORKER_IMAGE (digest da release)}
    <<: *hardened
    user: "1654:1654"
    environment:
      DOTNET_ENVIRONMENT: Production
      SecretsDirectory: /run/secrets
      Duora__PublicOrigin: https://${DUORA_DOMAIN:?defina DUORA_DOMAIN}
      # PROVISÓRIO: ainda não há provedor de e-mail (pendência M3). O adaptador de desenvolvimento grava .eml no
      # tmpfs, que some no restart: e-mails de conta não chegam a ninguém. Não abrir para participantes reais assim.
      Email__PickupDirectory: /tmp/duora-mail
    secrets:
      - source: duora_app_connection
        target: ConnectionStrings__Duora
    tmpfs:
      - /tmp:size=64m,mode=1777
    # data: banco; egress: saída para storage, e-mail e verificação etária. Sem porta e sem endpoint público.
    networks: [data, egress]
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1"
          pids: 256

  edge:
    image: ${DUORA_EDGE_IMAGE:?defina DUORA_EDGE_IMAGE (digest da release)}
    <<: *hardened
    user: "10001:10001"
    # Usuário sem privilégio abre 80/443 sem capability (no-new-privileges impede a capability de arquivo).
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    environment:
      DUORA_DOMAIN: ${DUORA_DOMAIN:?defina DUORA_DOMAIN}
      DUORA_TLS: ${DUORA_TLS:?defina DUORA_TLS (e-mail ACME ou internal)}
    # Única superfície publicada no host (spec 15.2). 443/udp: HTTP/3.
    ports:
      - "${DUORA_HTTP_PORT:?defina DUORA_HTTP_PORT}:80"
      - "${DUORA_HTTPS_PORT:?defina DUORA_HTTPS_PORT}:443"
      - "${DUORA_HTTPS_PORT:?defina DUORA_HTTPS_PORT}:443/udp"
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      # Certificados e conta ACME persistem entre recriações (spec 15.3).
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge]
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
          pids: 128

  # Job exclusivo de migração: só roda com "--profile migrate run --rm migrator", chamado pelo deploy.
  migrator:
    image: ${DUORA_MIGRATOR_IMAGE:?defina DUORA_MIGRATOR_IMAGE (digest da release)}
    profiles: [migrate]
    <<: *hardened
    restart: "no"
    user: "1654:1654"
    secrets:
      - duora_migrator_connection
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks: [data]
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1"
          pids: 128

networks:
  # Subnet fixa: é o único endereço de origem em que o web confia para X-Forwarded-* (ForwardedHeaders
  # KnownNetworks, spec 11.3; docs/operations/deploy.md "Proxy confiável"). Mudar aqui exige mudar no backend.
  edge:
    ipam:
      config:
        - subnet: 172.30.10.0/24
  # internal: sem rota para fora. O banco só existe aqui.
  data:
    internal: true
  egress: {}
  # internal: WAL do postgres até o backup (TLS com certificado de cliente) e o SQL do duora_backup. Só os dois
  # participam. Subnet fixa: o IP do backup aparece no pg_hba.duora.conf e no pgbackrest-repo.conf.
  pgbackrest:
    internal: true
    ipam:
      config:
        - subnet: 172.30.21.0/24
  # Saída do backup (e do job de restore) para o repositório S3. O postgres não está aqui. Subnet fixa: é a origem
  # que o filtro DOCKER-USER do host reconhece (infra/ansible/roles/backup); mudar aqui exige mudar lá.
  backup-egress:
    ipam:
      config:
        - subnet: 172.30.20.0/24

volumes:
  pgdata:
  dataprotection:
  caddy_data:
  caddy_config:

secrets:
  postgres_superuser_password:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/postgres_superuser_password
  db_migrator_password:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/db_migrator_password
  db_app_password:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/db_app_password
  db_backup_password:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/db_backup_password
  pgbackrest_db_pgpass:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/pgbackrest_db_pgpass
  duora_app_connection:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/duora_app_connection
  duora_migrator_connection:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/duora_migrator_connection
  # Certificados do pgBackRest gerados por "duora-secrets init-backup" (CA própria, sem a chave da CA no host).
  pgbackrest_tls_ca.crt:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/pgbackrest_tls_ca.crt
  pgbackrest_tls_server.crt:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/pgbackrest_tls_server.crt
  pgbackrest_tls_server.key:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/pgbackrest_tls_server.key
  pgbackrest_tls_client.crt:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/pgbackrest_tls_client.crt
  pgbackrest_tls_client.key:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/pgbackrest_tls_client.key
  # Fornecidos pelo operador (docs/operations/backup-restore.md), não pelo duora-secrets: credenciais do provedor e
  # senha de criptografia com custódia fora da VPS. Só backup e restore recebem.
  pgbackrest_repo:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/pgbackrest_repo.conf
  pgbackrest_cipher:
    file: ${DUORA_SECRETS_DIR:?defina DUORA_SECRETS_DIR}/pgbackrest_cipher.conf
