# Autenticação do PostgreSQL do Duora (spec 15.2 e 18.3). Ativado por hba_file em postgresql.duora.conf; nenhuma
# entrada trust. A primeira regra que casa decide, então as recusas específicas vêm antes da regra geral.
#
# TYPE  DATABASE  USER                      ADDRESS            METHOD

# Socket: só o superusuário, e só pelo usuário postgres do próprio container (peer). O socket não é compartilhado
# com nenhum outro container. Usado pelo entrypoint, pelo duora-deploy (psql) e pela operação manual.
local   all       postgres                                     peer
local   all       all                                          reject

# pgBackRest: só do IP fixo do container backup na rede pgbackrest (compose.prod.yml), com senha.
host    postgres  duora_backup              172.30.21.10/32    scram-sha-256
host    all       duora_backup              all                reject

# Superusuário nunca pela rede.
host    all       postgres                  all                reject

# Aplicação e migrador pela rede data (subnet atribuída pelo Docker), com senha.
host    all       duora_app,duora_migrator  all                scram-sha-256

# Manutenção IPinfo: login separado, somente no banco Duora; privilégios mínimos são provisionados à parte.
host    duora     duora_geo_maintenance     all                scram-sha-256

# Qualquer outro papel ou origem: recusado.
host    all       all                       all                reject
