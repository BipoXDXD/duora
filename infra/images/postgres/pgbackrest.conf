# pgBackRest do lado do PostgreSQL (container postgres): só arquivamento e busca de WAL (spec 18.2).
# Manual: docs/operations/backup-restore.md.
#
# O postgres não fala com o repositório S3 e não tem as credenciais nem a senha de criptografia dele: o WAL vai por
# TLS com certificado de cliente ao container backup (repository host), o único com saída para o S3. Certificados
# gerados por `duora-secrets init-backup` e montados como Compose secrets.

[global]
repo1-host=backup
repo1-host-type=tls
repo1-host-ca-file=/run/secrets/pgbackrest_tls_ca.crt
repo1-host-cert-file=/run/secrets/pgbackrest_tls_client.crt
repo1-host-key-file=/run/secrets/pgbackrest_tls_client.key

# Comprime antes de enviar: menos tráfego até o backup e até o S3.
compress-type=zst

# Arquivamento assíncrono com teto. Passado archive-push-queue-max de WAL acumulado no pg_wal (backup ou S3 fora do
# ar), o pgBackRest DESCARTA a fila e avisa no log: a cadeia de PITR quebra e um full novo é necessário, mas o
# PostgreSQL não para por disco cheio. O alerta (duora-backup verify a cada 15 min) dispara muito antes disso.
archive-async=y
archive-push-queue-max=4GiB
# O teto só é conferido no início de cada rodada assíncrona; lotes menores conferem mais vezes.
archive-push-batch-size=512MiB
# Spool (camada gravável do container, descartado na recriação): status do push e WAL pré-buscado no restore.
spool-path=/var/spool/pgbackrest
archive-get-queue-max=256MiB

# Logs só no console: archive-push e archive-get vão para o log do PostgreSQL (stderr). Arquivo de log na camada do
# container cresceria sem rotação.
log-level-console=info
log-level-file=off

[duora]
# Layout do PostgreSQL 18 na imagem oficial (spec 15.4, D-INF-04).
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
