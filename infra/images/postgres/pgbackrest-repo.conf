# pgBackRest do container backup (repository host) e do job de restore (spec 18.2 e 18.3).
# Selecionado por PGBACKREST_CONFIG no compose.prod.yml. Manual e conta da retenção: docs/operations/backup-restore.md.
#
# Único processo com saída para o repositório S3 e com as credenciais dele. Endpoint, bucket, região e chaves chegam
# por segredo em /etc/pgbackrest/conf.d/repo.conf e a senha de criptografia em /etc/pgbackrest/conf.d/cipher.conf
# (Compose secrets; o provedor ainda não foi escolhido). Sem eles todo comando falha: não existe destino padrão.

[global]
repo1-type=s3
repo1-path=/duora
repo1-s3-key-type=shared
# Criptografia do lado do cliente: o provedor só vê blocos cifrados. A senha (repo1-cipher-pass) vem de cipher.conf
# e precisa de custódia fora da VPS; sem ela o backup é inútil.
repo1-cipher-type=aes-256-cbc
# Janela recuperável de 14 dias com full semanal e diferencial diário: um full só expira se sobrar outro com pelo
# menos 14 dias, e o WAL só expira antes do full mais antigo que restou. Diferenciais vivem até o full deles expirar
# (repo1-retention-diff não definido). A conta completa está no manual.
repo1-retention-full-type=time
repo1-retention-full=14
# Agrupa arquivos pequenos do PGDATA em objetos maiores: menos requisições ao object storage.
repo1-bundle=y

compress-type=zst
process-max=2
start-fast=y

# Servidor TLS que recebe archive-push e archive-get do postgres. Só o certificado de cliente do postgres (CN
# duora-postgres), assinado pela CA do Duora, é aceito, e só para a stanza duora.
tls-server-address=*
tls-server-ca-file=/run/secrets/pgbackrest_tls_ca.crt
tls-server-cert-file=/run/secrets/pgbackrest_tls_server.crt
tls-server-key-file=/run/secrets/pgbackrest_tls_server.key
tls-server-auth=duora-postgres=duora

log-level-console=info
log-level-file=off

[duora]
# PGDATA e socket do postgres montados só leitura (backup físico lê os arquivos e chama pg_backup_start/stop
# pelo socket). No job de restore o mesmo volume é montado com escrita.
pg1-path=/var/lib/postgresql/18/docker
pg1-socket-path=/var/run/postgresql
