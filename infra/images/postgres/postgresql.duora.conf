# Arquivamento contínuo de WAL para o pgBackRest (spec 18.2). Incluído no postgresql.conf do PGDATA por
# initdb/20-duora-config.sh na primeira inicialização do volume; o restore traz a mesma linha de include junto com
# o PGDATA. Ajustes de recursos (shared_buffers, max_connections) ficam no compose.prod.yml.
# Manual: docs/operations/backup-restore.md.

# Backup físico e PITR exigem pelo menos replica (já é o padrão; fica explícito para ninguém baixar para minimal).
wal_level = replica

archive_mode = on
# Modo assíncrono (archive-async=y em /etc/pgbackrest/pgbackrest.conf): o retorno 0 só sai depois que o segmento
# foi confirmado no repositório externo; a fila tem teto (archive-push-queue-max) para o pg_wal não encher o disco.
archive_command = 'pgbackrest --stanza=duora archive-push %p'

# Em baixa atividade, força a troca de segmento a cada 60 s para o WAL sair do host. Sozinho não garante o RPO de
# 5 min: falha de rede ou de destino só aparece pelo duora-backup verify (timer e deploy).
archive_timeout = 60
