# Configuração do Ansible do Duora. Rode a partir de infra/ansible/ (docs em infra/README.md).
[defaults]
roles_path = ./roles
# Sem inventário padrão: aponte -i para o inventário real, que fica fora do git (contém endereço do host).
interpreter_python = /usr/bin/python3
# Host key conferida contra o known_hosts do operador; nunca aceitar chave nova em silêncio (spec 17.2).
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
