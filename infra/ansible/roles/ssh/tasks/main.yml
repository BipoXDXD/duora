---
- name: Garantir que o usuário administrativo tem chave autorizada antes de desligar senha
  ansible.builtin.stat:
    path: "~{{ duora_admin_user }}/.ssh/authorized_keys"
  register: ssh_admin_keys

- name: Recusar o endurecimento se o operador ficaria trancado para fora
  ansible.builtin.assert:
    that: ssh_admin_keys.stat.exists and ssh_admin_keys.stat.size > 0
    fail_msg: "{{ duora_admin_user }} não tem authorized_keys; adicione a chave antes de desligar a senha."

- name: Endurecer o sshd (só chave, sem root, sem senha; spec 15.2)
  ansible.builtin.template:
    src: 00-duora.conf.j2
    # 00-: o Ubuntu inclui sshd_config.d/*.conf no topo e o primeiro valor vence (ex.: 50-cloud-init.conf).
    dest: /etc/ssh/sshd_config.d/00-duora.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reiniciar ssh
