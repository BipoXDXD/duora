---
- name: Instalar pacotes de base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3
      - unattended-upgrades
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Usar UTC no relógio do sistema (logs e cron coerentes com o banco)
  community.general.timezone:
    name: Etc/UTC

- name: Ligar atualização diária de listas e o unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Gerenciado pelo Ansible (infra/ansible/roles/base).
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Definir política de reinício das atualizações automáticas (spec 15.5)
  ansible.builtin.template:
    src: 52duora-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52duora-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

# Um arquivo local do apt.conf.d lido depois do 52 (ex.: 99local) sobrescreveria o horário em silêncio, e o reinício
# voltaria a cortar os timers longos do backup. Confere o valor efetivo em vez de confiar no arquivo gravado. Fora do
# check mode: antes da primeira aplicação o template ainda não está no host, e a leitura não altera nada.
- name: Ler a política de reinício efetiva do apt
  ansible.builtin.command:
    argv:
      - apt-config
      - shell
      - REBOOT
      - Unattended-Upgrade::Automatic-Reboot
      - REBOOT_TIME
      - Unattended-Upgrade::Automatic-Reboot-Time
  register: base_apt_reboot_policy
  changed_when: false
  when: not ansible_check_mode

- name: Recusar override local da política de reinício
  ansible.builtin.assert:
    that:
      - base_apt_reboot_policy.stdout_lines | sort == base_expected_reboot_policy | sort
    fail_msg: >-
      Outro arquivo em /etc/apt/apt.conf.d sobrescreve o reinício automático:
      {{ base_apt_reboot_policy.stdout_lines }}. Esperado: {{ base_expected_reboot_policy }}.
      Alinhe ou remova o override antes de seguir.
    quiet: true
  vars:
    base_expected_reboot_policy:
      - "REBOOT='{{ 'true' if duora_unattended_reboot else 'false' }}'"
      - "REBOOT_TIME='{{ duora_unattended_reboot_time }}'"
  when: not ansible_check_mode

# Usuários sem root não veem processos alheios em /proc (linha de comando, ambiente). Defesa em profundidade: o
# segredo do migrador já não passa em argumento. Root, o dockerd e o sudo do deploy continuam vendo tudo; os
# containers têm o próprio /proc.
- name: Montar /proc com hidepid=invisible
  ansible.posix.mount:
    path: /proc
    src: proc
    fstype: proc
    opts: defaults,hidepid=invisible
    state: mounted
