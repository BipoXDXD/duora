---
- name: Instalar pacotes de base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3
      - unattended-upgrades
      - ufw
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Usar UTC no relógio do sistema (logs e cron coerentes com o banco)
  community.general.timezone:
    name: Etc/UTC

- name: Ligar atualização diária de listas e o unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      // Gerenciado pelo Ansible (infra/ansible/roles/base).
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";

- name: Definir política de reinício das atualizações automáticas (spec 15.5)
  ansible.builtin.template:
    src: 52duora-unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52duora-unattended-upgrades
    owner: root
    group: root
    mode: "0644"
