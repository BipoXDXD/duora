# Catálogo de fontes técnicas do Duora (spec 21.2 e 25.1).
#
# Uma entrada por ficha D-* da seção 25 da spec (78 fichas). Campos:
#   id          ID da ficha na spec
#   topico      tópico consultado (título da ficha)
#   urls        páginas da ficha, na ordem da spec
#   versao      versão/commit da documentação consultada; "página atual" quando o site não tem seletor
#   consultado  data de consulta (AAAA-MM-DD)
#   download    status da cópia local: ok | parcial | fonte alternativa | pendente (ficha de lacuna, sem fonte consultada)
#   requisitos  IDs da spec sustentados (INV, A11Y, ADR, seção ou gate)
#   testes      testes de aceite (T-*) que dependem da ficha; vazio quando a ficha só sustenta construção
#   responsavel dono da ficha
#
# Requisitos e testes vêm da matriz de cobertura (spec 25.18). Fichas que não aparecem nela
# usam as seções da spec que as citam. Atualize esta entrada no mesmo PR que muda o comportamento,
# a versão ou o fornecedor sustentado pela ficha (spec 25.19).
#
# Cópias locais da documentação ficam sob custódia do responsável, fora do repositório.

